name: CI

on:
  push:
    branches: [main, feature/production-composition]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run the portable suite without Windows-only SEA smoke tests
        run: npm test -- $(find test -name '*.test.ts' ! -path 'test/contract/sea-smoke.test.ts' -print)
      - run: npm test -- test/contract/release-assets.test.ts test/integration/installer.test.ts
      - name: Check the portable installer syntax
        run: bash -n scripts/install.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  windows-sea:
    name: Windows SEA gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -LiteralPath dist -Recurse -Force }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:sea
      - run: npm test
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - shell: pwsh
        run: .\dist\harness-mrtool.exe self-test --output json
