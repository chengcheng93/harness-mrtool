name: CIon:  push:    branches: [main, feature/production-composition]  pull_request:  workflow_dispatch:permissions:  contents: readjobs:  portable:    name: Portable tests    runs-on: ubuntu-latest    timeout-minutes: 20    steps:      - uses: actions/checkout@v4      - uses: actions/setup-node@v4        with:          node-version: 24.16.0          cache: npm      - run: npm ci      - run: npm run typecheck      - name: Run the portable suite without Windows-only SEA smoke tests        run: npm test -- --test-concurrency=1 $(find test -name '*.test.ts' ! -path 'test/contract/sea-smoke.test.ts' -print)      - run: npm test -- test/contract/release-assets.test.ts test/integration/installer.test.ts      - name: Check the portable installer syntax        run: bash -n scripts/install.sh  secret-scan:    name: Secret scan    runs-on: ubuntu-latest    timeout-minutes: 10    steps:      - uses: actions/checkout@v4
