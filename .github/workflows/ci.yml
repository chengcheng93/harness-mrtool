name: CI

on:
  push:
    branches: [main, feature/production-composition]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run the portable suite without Windows-only SEA smoke tests
        run: npm test -- --test-concurrency=1 $(find test -name '*.test.ts' ! -path 'test/contract/sea-smoke.test.ts' -print)
      - run: npm test -- test/contract/release-assets.test.ts test/integration/installer.test.ts
      - name: Check the portable installer syntax
        run: bash -n scripts/install.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-sea:
    name: Windows SEA gate
    runs-on: windows-latest
    # The serial native/ACL suite hit the 30-minute job budget in run35189643169.
    # Keep every test and the serial isolation; cancellation is never a pass.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -LiteralPath dist -Recurse -Force }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:sea
      - name: Run Windows durability smoke tests
        run: npm test -- --test-concurrency=1 --test-name-pattern="Windows publisher flushes once|default Windows ACL adapter secures" test/integration/windows-write-through-move.test.ts test/unit/context-store.test.ts
      - run: npm test -- --test-concurrency=1
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts -Filter *.ps1 | Select-Object -ExpandProperty FullName)
          $files += Join-Path $PWD 'skill/harness-mr/scripts/bootstrap.ps1'
          foreach ($path in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - shell: pwsh
        run: .\dist\harness-mrtool.exe self-test --output json
      - name: Record verified development executable hash
        shell: pwsh
        run: |
          (Get-FileHash .\dist\harness-mrtool.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content .\dist\harness-mrtool.exe.sha256 -NoNewline
      - name: Upload verified development SEA artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-mrtool-dev-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/harness-mrtool.exe
            dist/harness-mrtool.exe.sha256
            dist/sea-build-receipt.json

  macos-arm64:
    name: macOS ARM64 native gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          architecture: arm64
          cache: npm
      - name: Require native Darwin ARM64 and physical temporary paths
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
          command -v perl
          printf 'TMPDIR=%s\n' "$(node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())')" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:sea
      - name: Run the full suite with bounded failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp "$RUNNER_TEMP/test-spec.XXXXXX")"
          trap 'rm -f "$log"' EXIT
          status=0
          npm test -- --test-concurrency=1 --test-reporter=spec >"$log" 2>&1 || status=$?
          if (( status != 0 )); then
            node scripts/report-test-failures.mjs "$log" "$status" 2>/dev/null || printf '%s\n' '::error::Test command failed; failure reporter unavailable.'
          fi
          exit "$status"
      - name: Verify and name the native development executable
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/codesign --verify --strict --verbose=2 dist/harness-mrtool.exe
          cp dist/harness-mrtool.exe dist/harness-mrtool
          cmp dist/harness-mrtool.exe dist/harness-mrtool
          ./dist/harness-mrtool self-test --output json
          shasum -a 256 dist/harness-mrtool > dist/harness-mrtool.sha256
      - name: Upload native development evidence (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: harness-mrtool-dev-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/harness-mrtool
            dist/harness-mrtool.exe
            dist/harness-mrtool.sha256
            dist/sea-build-receipt.json
