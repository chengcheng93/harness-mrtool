name: Release Template Bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable template release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: npm ci
      - name: Require an immutable semantic release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - run: npm run typecheck
      - run: npm test -- test/unit/bundle.test.ts test/unit/update-manifest.test.ts
      - name: Create immutable template receipt
        shell: bash
        run: |
          set -euo pipefail
          test -d template-bundle
          if find template-bundle -type l -print -quit | grep -q .; then exit 1; fi
          test -n "${BUNDLE_RECEIPT_B64:-}"
          mkdir -p dist/template-bundle
          (cd template-bundle && zip -X -q -r ../dist/template-bundle/template-bundle.zip .)
          printf '%s' "$BUNDLE_RECEIPT_B64" | base64 --decode > dist/template-bundle/bundle-receipt.envelope.json
          (cd dist/template-bundle && sha256sum template-bundle.zip bundle-receipt.envelope.json > SHA256SUMS)
          test -s dist/template-bundle/template-bundle.zip
          test -s dist/template-bundle/bundle-receipt.envelope.json
        env:
          BUNDLE_RECEIPT_B64: ${{ secrets.TEMPLATE_BUNDLE_RECEIPT_B64 }}
      - name: Attest the verified template archive
        uses: actions/attest@v4
        with:
          subject-path: dist/template-bundle/template-bundle.zip
      - name: Upload verified template assets
        uses: actions/upload-artifact@v4
        with:
          name: release-template-${{ github.sha }}
          path: dist/template-bundle
      - name: Publish a draft after verification
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}-template" --draft --target "${GITHUB_SHA}" --title "${RELEASE_TAG} template" --generate-notes dist/template-bundle/template-bundle.zip dist/template-bundle/bundle-receipt.envelope.json dist/template-bundle/SHA256SUMS
      - name: Download and verify the draft assets
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf draft-template
          gh release download "${RELEASE_TAG}-template" --dir draft-template --pattern 'template-bundle.zip' --pattern 'bundle-receipt.envelope.json' --pattern 'SHA256SUMS'
          (cd draft-template && sha256sum -c SHA256SUMS)
      - name: Publish the verified template draft
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}-template" --draft=false
      - name: Verify immutable template release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}-template" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "${RELEASE_TAG}-template" --json isImmutable --jq .isImmutable)" = true
