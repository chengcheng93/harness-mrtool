  - changes.technicalChanges
  - changes.outOfScope
  - motivation.background
  - motivation.whyNeeded
  - workItem
  - impact.details
  - verification.items
  - verification.acceptanceEvidence
  - verification.knownGaps
  - documentation.details
  - risk.items
